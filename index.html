<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micronauta | Elevando negocios locales</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/Logo_Micronauta_3dnoBGpng.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/logos/Logo_Micronauta_3dnoBGpng.png?v=1">
  <link rel="apple-touch-icon" href="/assets/logos/Logo_Micronauta_3dnoBGpng.png?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;500;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#36958F',
            accent: '#FCCAA3',
            foreground: '#ffffff',
            card: '#2d7d78',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'glow-pulse': 'glow-pulse 2s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s linear infinite',
            'spin-slow': 'spin 8s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            'glow-pulse': {
              '0%, 100%': { boxShadow: '0 0 5px rgba(252, 202, 163, 0.4), 0 0 20px rgba(252, 202, 163, 0.2)' },
              '50%': { boxShadow: '0 0 20px rgba(252, 202, 163, 0.8), 0 0 40px rgba(252, 202, 163, 0.4)' },
            },
            shimmer: {
              '100%': { transform: 'translateX(100%)' },
            },
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/index.css">
</head>

<body class="dark bg-background text-white selection:bg-accent selection:text-background">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
