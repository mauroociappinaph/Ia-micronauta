<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micronauta | Elevando negocios locales</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/Logo_Micronauta_3dnoBGpng.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/logos/Logo_Micronauta_3dnoBGpng.png?v=1">
  <link rel="apple-touch-icon" href="/assets/logos/Logo_Micronauta_3dnoBGpng.png?v=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;500;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {

            accent: '#FCCAA3',     // Peach
            foreground: '#ffffff',
            card: '#2d7d78',       // More solid version for cards
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'glow-pulse': 'glow-pulse 2s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s linear infinite',
            'spin-slow': 'spin 8s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            'glow-pulse': {
              '0%, 100%': { boxShadow: '0 0 5px rgba(252, 202, 163, 0.4), 0 0 20px rgba(252, 202, 163, 0.2)' },
              '50%': { boxShadow: '0 0 20px rgba(252, 202, 163, 0.8), 0 0 40px rgba(252, 202, 163, 0.4)' },
            },
            shimmer: {
              '100%': { transform: 'translateX(100%)' },
            },
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #36958F !important;
      color: white;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .btn-glow:hover {
      box-shadow: 0 0 25px rgba(252, 202, 163, 0.6);
      filter: brightness(1.1);
    }

    .glass-container {
      background: rgba(45, 125, 120, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #36958F;
    }

    ::-webkit-scrollbar-thumb {
      background: #FCCAA3;
      border-radius: 10px;
    }

    @keyframes subtleZoom {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.05);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "zustand/": "https://esm.sh/zustand@^5.0.9/",
    "zustand": "https://esm.sh/zustand@^5.0.9"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="dark bg-background text-white selection:bg-accent selection:text-background">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
